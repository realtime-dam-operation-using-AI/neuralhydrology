# --- Experiment configurations --------------------------------------------------------------------

# experiment name, used as folder name
experiment_name: yddam_hourly_cudalstm

run_dir:

# files to specify training, validation and test basins (relative to code root or absolute path)
# 유역(댐)이 하나뿐이므로 세 파일이 모두 같은 basin 파일을 가리킵니다.
train_basin_file: YDDam_basin.txt
validation_basin_file: YDDam_basin.txt
test_basin_file: YDDam_basin.txt

# training, validation and test time periods (format = 'dd/mm/yyyy')
# 원자료 기간: 2002-01-01 01:00 ~ 2026-01-01 00:00 (hourly)
#   train      : 2002 ~ 2017 (16년, 2005-08 최대 홍수 포함)
#   validation : 2018 ~ 2021 ( 4년, 2020-08 홍수 포함)  -> early stopping / 최고 epoch 선택
#   test       : 2022 ~ 2025 ( 4년, 2023 홍수 포함)     -> 최종 평가 (학습 중 절대 보지 않음)
train_start_date: "01/01/2002"
train_end_date: "31/12/2017"
validation_start_date: "01/01/2018"
validation_end_date: "31/12/2021"
test_start_date: "01/01/2022"
test_end_date: "31/12/2025"

# fixed seed so that the run is reproducible
seed: 111

# which GPU (id) to use [in format of cuda:0, cuda:1 etc, or cpu, mps or None]
device: cuda:0

# --- Validation configuration ---------------------------------------------------------------------

# early stopping requires validation after *every* epoch (see Config.early_stopping)
validate_every: 1
validate_n_random_basins: 1
metrics:
  - NSE
  - KGE

# --- Model configuration --------------------------------------------------------------------------

model: cudalstm
head: regression
output_activation: linear

hidden_size: 64
initial_forget_bias: 3
output_dropout: 0.4

# --- Training configuration -----------------------------------------------------------------------

optimizer: Adam
loss: MSE

# NOTE: with early_stopping: True the library also switches on ReduceLROnPlateau
# (Config.dynamic_learning_rate mirrors early_stopping), so only the epoch-0 entry is used as the initial LR.
learning_rate:
  0: 1e-2
  30: 5e-3
  40: 1e-3

batch_size: 256

# 30 epochs is an upper bound; early stopping decides when we actually stop
epochs: 50
clip_gradient_norm: 1

# --- Early stopping -------------------------------------------------------------------------------

early_stopping: True
patience_early_stopping: 5
minimum_epochs_before_early_stopping: 10
patience_dynamic_learning_rate: 3
factor_dynamic_learning_rate: 0.5

# --- Sequence configuration -----------------------------------------------------------------------

# 720 hours = 30 days of hourly look-back: 선행 강우(토양 습윤 상태)를 기억할 수 있는 길이
seq_length: 720
predict_last_n: 1

num_workers: 4
log_interval: 50
log_tensorboard: True
log_n_figures: 1

# every epoch is checkpointed so that we can evaluate the *best* epoch, not just the last one
save_weights_every: 1

# --- Data configurations --------------------------------------------------------------------------

# csv 파일을 그대로 읽는 데이터셋 클래스 (neuralhydrology/datasetzoo/hourlycsv.py)
dataset: hourlycsv
data_dir: ../../data/YDDam

# hourlycsv 에서는 선택 사항(기본값 hourly). time_series/input/hourly 아래에서 파일을 찾습니다.
forcings:
  - hourly

# 입력 변수: csv 컬럼명 그대로
dynamic_inputs:
  - hrf

# 목표 변수: csv 컬럼명 그대로
target_variables:
  - hinflw

# 유입량은 음수가 될 수 없으므로 예측값의 음수를 0으로 자릅니다 (평가 시에만 적용)
clip_targets_to_zero:
  - hinflw
