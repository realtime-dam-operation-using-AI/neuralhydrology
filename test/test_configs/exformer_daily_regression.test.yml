# --- Experiment configurations --------------------------------------------------------------------
experiment_name: test_run

run_dir:

train_basin_file: ./test/test_data/4_basins_test_set.txt
validation_basin_file: ./test/test_data/4_basins_test_set.txt
test_basin_file: ./test/test_data/4_basins_test_set.txt

train_start_date: '01/01/2000'
train_end_date: '31/12/2001'
validation_start_date: '01/01/2001'
validation_end_date: '31/12/2002'
test_start_date: '01/01/2001'
test_end_date: '31/12/2002'

seed: 111
device: cpu

# --- Validation configuration ---------------------------------------------------------------------
validate_every: 1
validate_n_random_basins: 4
cache_validation_data: True
metrics:
  - NSE

# --- Model configuration --------------------------------------------------------------------------
model: exformer
head: regression
output_activation: linear

# 4 input channels (2 dynamic + 2 static), 30 steps -> 6 patches of 5 steps.
# attention dimension = exformer_embed_dim * exformer_patch_size = 4 * 5 = 20, divisible by 4 heads.
exformer_patch_size: 5
exformer_embed_dim: 4
exformer_n_heads: 4
exformer_encoder_depth: 1
exformer_d_ff: 4
exformer_dropout: 0.1
exformer_local_window: 2
exformer_stride: 2
exformer_mask: dozer_ext_0
exformer_patch_thres: 1
exformer_moving_avg:
  - 3
  - 5
exformer_extreme_variable: prcp(mm/day)
exformer_extreme_threshold: 1.0

# --- Training configuration -----------------------------------------------------------------------
optimizer: Adam
loss: MSE
learning_rate:
  0: 1e-3
batch_size: 256
epochs: 1
clip_gradient_norm: 1

predict_last_n: 1
seq_length: 30

num_workers: 0
log_interval: 5
log_tensorboard: False
log_n_figures: 0
save_weights_every: 1
save_validation_results: False

# --- Data configurations --------------------------------------------------------------------------
dataset: camels_us
data_dir: ./test/test_data/camels_us
forcings: daymet
dynamic_inputs:
  - prcp(mm/day)
  - tmax(C)
target_variables:
  - QObs(mm/d)
static_attributes:
  - elev_mean
  - slope_mean
